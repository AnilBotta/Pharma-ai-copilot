[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "be-stats"
version = "0.6.0"
description = "Bioequivalence statistics: average BE, power and sample size."
requires-python = ">=3.11"
dependencies = [
    # scipy supplies the t and non-central t distributions. Chosen over a
    # hand-rolled implementation on purpose: for work intended to support a
    # regulatory submission, "we used scipy and validated against published
    # reference values" is a far easier position to defend than "we wrote our
    # own incomplete beta function".
    "scipy>=1.11",
    # numpy arrived with scipy from the start and was used through it. EMA's
    # Method A needs a design matrix and a least-squares solve directly, so it
    # is now imported by name and therefore declared by name. Depending on a
    # transitive dependency is depending on someone else's decision not to
    # change theirs.
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `tests` importable as a package, regardless of where pytest was invoked from.
#
# `test_algorithm_conformance.py` reuses `make_criterion` from
# `tests.unit.test_rsabe_criterion`, which resolved only when the working
# directory happened to be `be-stats/`. Run as `pytest be-stats/tests` from the
# repository root - which is what a whole-repo run does - the same two tests
# failed with `ModuleNotFoundError: No module named 'tests'`.
#
# That is ENG-001, recorded during the VAL-FDA-HVD-001 investigation as an
# intermittent failure. It is not intermittent: it depends on the invocation,
# which is why it appeared once and then would not reproduce. rootdir is this
# file either way, so one relative entry fixes both invocations.
pythonpath = ["."]
