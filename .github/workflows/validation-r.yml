# External validation: be-stats against PowerTOST.
#
# SEPARATE FROM THE ORDINARY TEST JOB, ON PURPOSE.
#
# `be_stats` depends on scipy and nothing else. Making the unit suite require
# Docker or R would make a pure Python package's tests unrunnable for anyone
# without them, to check something that is not part of the package.
#
# So this job is optional and slow, and the ordinary suite stays fast. What the
# ordinary suite DOES cover is the harness itself - see
# tests/validation/test_external_harness.py, which runs with no R at all and
# asserts that a missing environment reports SKIPPED rather than PASS.

name: validation-r

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "be-stats/src/**"
      - "be-stats/validation/external/**"
      # The Appendix C case oracle: a change to the cases or to the Julia
      # script must re-run the comparison, not inherit the previous verdict.
      - "be-stats/validation/appendix_c/**"
      - "be-stats/tests/validation/test_appendix_c_case_oracle.py"
      - ".github/workflows/validation-r.yml"
  schedule:
    # Weekly. The oracle is pinned, so a change here means the pins drifted or
    # something in be-stats moved - both worth hearing about without waiting
    # for someone to remember to run it.
    - cron: "0 4 * * 1"

jobs:
  powertost-cross-check:
    name: PowerTOST cross-check
    runs-on: ubuntu-latest
    # Generous: the Monte Carlo cases simulate 20,000 studies each through the
    # full be-stats pipeline, and PowerTOST runs 100,000 per case on its side.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Build the pinned validation image
        run: docker build -t be-stats-validation be-stats/validation/external

      - name: Run the cross-check
        # --require-r makes a missing R a failure INSIDE the image, where a
        # missing R means the image is broken. Outside it, absence is SKIPPED.
        run: |
          docker run --rm -v "$PWD:/work" be-stats-validation

      - name: Show the report
        # Informational only. If the build or the run failed, that step is
        # already red and the enforcement below will fail too - three red steps
        # for one root cause is noise that buries the actual error.
        if: always()
        continue-on-error: true
        run: |
          if [ -f be-stats/validation/external/report.txt ]; then
            cat be-stats/validation/external/report.txt
          else
            echo "no report was produced — the run failed before comparing"
          fi

      - name: Fail if anything was skipped
        # A skipped comparison in THIS job is a broken environment, not an
        # acceptable outcome. The distinction only exists for local runs.
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          path = pathlib.Path("be-stats/validation/external/report.json")
          if not path.exists():
              print("no report.json"); sys.exit(1)
          report = json.loads(path.read_text())
          bad = [c for c in report["comparisons"]
                 if c["outcome"] in ("SKIPPED", "ERROR", "FAIL")]
          for c in bad:
              print(f"{c['outcome']:<8} {c['case_id']}/{c['quantity']}  {c['detail']}")
          print()
          for method, status in report["tier3"].items():
              print(f"tier3 {method:<20} {status['tier3']}")
          sys.exit(1 if bad else 0)
          PY

      - name: Investigate FDA Appendix C oracles
        # An INVESTIGATION, not a validation. It fits candidate R models
        # against the only published results for FDA's Appendix C model and
        # records how far each one gets. Nothing here gates the build:
        # `continue-on-error` because a candidate that will not converge is a
        # finding to write down, not a reason to fail a cross-check that
        # already passed.
        #
        # It runs after the enforcement step above so it can never be confused
        # with it, and its output is uploaded alongside the report.
        if: always()
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/work" be-stats-validation \
            Rscript be-stats/validation/external/investigate_appendix_c.R \
              be-stats/validation/ema/cases/ema_pkwp_qa_datasets.json \
              be-stats/validation/external/appendix_c_investigation.json

      - name: Test the ReplicateBE.jl Satterthwaite claim
        # The last open item in VAL-FDA-APPENDIX-C-001. No R package computes
        # Satterthwaite df for Appendix C's covariance structure; this one
        # claims to, and a claim is not evidence.
        #
        # `continue-on-error` for the same reason as the R investigation above:
        # an oracle candidate that fails to converge is a finding to write
        # down, not a reason to fail a cross-check that already passed.
        if: always()
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/work" be-stats-validation \
            julia be-stats/validation/external/investigate_appendix_c_julia.jl \
              be-stats/validation/ema/cases/ema_pkwp_qa_datasets.json \
              be-stats/validation/external/appendix_c_julia.json

      - name: Upload the investigation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-validation-report
          path: |
            be-stats/validation/external/report.json
            be-stats/validation/external/report.txt
            be-stats/validation/external/powertost_results.json
            be-stats/validation/external/appendix_c_investigation.json
            be-stats/validation/external/appendix_c_julia.json
          if-no-files-found: warn

  appendix-c-case-oracle:
    name: Appendix C case oracle (ReplicateBE.jl)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # SEPARATE JOB, AND IT GATES.
    #
    # The two Julia/R steps in the job above are INVESTIGATIONS - they ask
    # whether a candidate oracle can fit Appendix C at all, and a candidate that
    # will not converge is a finding to write down. `continue-on-error` is right
    # there.
    #
    # This is not that. ReplicateBE.jl was ESTABLISHED as a tier-3 oracle for
    # fully replicate designs in PR #61, by reproducing EMA's published SAS
    # output exactly. The nine synthetic cases are checked against it, and a
    # disagreement is a defect in one of the two implementations - so this job
    # fails, and it fails just as hard when the comparison is SKIPPED. A
    # validation that quietly does not run is worse than one that fails,
    # because it reports green.

    steps:
      - uses: actions/checkout@v4

      - name: Build the pinned validation image
        run: docker build -t be-stats-validation be-stats/validation/external

      - name: Run ReplicateBE.jl over the nine cases
        run: |
          docker run --rm -v "$PWD:/work" be-stats-validation \
            julia be-stats/validation/appendix_c/oracle/replicatebe_cases.jl \
              be-stats/validation/appendix_c/cases/full_replicate_cases.json \
              be-stats/validation/appendix_c/oracle/replicatebe_cases_run.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install be-stats
        run: pip install -e "be-stats[dev]"

      - name: Compare, against the run just produced
        # Deliberately NOT against the committed frozen file: that would pass
        # if the frozen file had gone stale relative to the pinned oracle.
        env:
          BE_STATS_APPENDIX_C_CASE_ORACLE: >-
            be-stats/validation/appendix_c/oracle/replicatebe_cases_run.json
        run: |
          python -m pytest be-stats/tests/validation/test_appendix_c_case_oracle.py \
            -v --junitxml=appendix-c-oracle.xml

      - name: Fail if any comparison was skipped
        # pytest exits 0 on a fully skipped module. Locally that is correct -
        # Julia is not installed on a developer machine. Here it means the
        # oracle file never arrived, and green would be a lie.
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("appendix-c-oracle.xml")
          if not path.exists():
              print("no junit report - pytest never ran"); sys.exit(1)
          suite = ET.parse(path).getroot()
          totals = {k: int(suite.get(k) or 0) for k in ("tests", "skipped", "failures", "errors")}
          # The root may be <testsuites>; take the aggregate either way.
          if suite.tag == "testsuites" and not totals["tests"]:
              for child in suite:
                  for k in totals:
                      totals[k] += int(child.get(k) or 0)
          print(totals)
          if totals["tests"] == 0:
              print("no tests collected"); sys.exit(1)
          if totals["skipped"]:
              print(f"{totals['skipped']} comparison(s) SKIPPED - the oracle did not run")
              sys.exit(1)
          sys.exit(1 if totals["failures"] or totals["errors"] else 0)
          PY

      - name: Upload the case oracle run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appendix-c-case-oracle
          path: |
            be-stats/validation/appendix_c/oracle/replicatebe_cases_run.json
            appendix-c-oracle.xml
          if-no-files-found: warn
